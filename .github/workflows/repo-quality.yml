name: Repository Quality

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  repo-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository structure and data policy
        run: python .github/scripts/repo_quality.py
