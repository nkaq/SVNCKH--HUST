[platformio]
src_dir = drivers
test_dir = tests

[env:esp32s3_n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
test_build_src = yes

[env:esp32s3_n16r8_adxl_recovery_test]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEE2_TEST_ADXL_HARDWARE_PRESENT=1
    -DEE2_TEST_ADXL_SDA_PIN=8
    -DEE2_TEST_ADXL_SCL_PIN=9
    -DEE2_TEST_ADXL_INT_PIN=10
test_build_src = yes

